<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
       <title>Find Your Nearest Train Station</title>
    </head>
    <body>
     <h1>Do <i>You</i> Like Trains?</h1>
     
     <!--action directs form to send data back main route
     and method prevents data from being shown in URL (goes in background)-->
     <form action="/" method="POST">
        <label for="zipcode">Enter your Zip Code:</label>
        <input type="text" id="zipcode" name="zipcode" required>
        <button type="submit">Find Station</button>

     </form>
    
    </body>
